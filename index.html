<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Americano Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ Americano Pro</h1>
      <div id="user-info"></div>
    </header>

    <div id="login-screen" class="card">
      <h2>🔐 Iniciar sesión</h2>
      <p>Usá tu cuenta de Google para crear o unirte a un torneo.</p>
      <button id="login-btn" class="primary">🪪 Iniciar con Google</button>
    </div>

    <div id="setup" class="card hidden">
      <h2>🎯 Crear Torneo</h2>
      <input type="text" id="tournament-name" placeholder="Nombre del torneo" value="Torneo Americano">
      <button id="create-tournament" class="primary">✨ Crear y Comenzar</button>
    </div>

    <div id="join-screen" class="card hidden">
      <h2>👥 Unirse a Torneo</h2>
      <p>Código: <strong id="current-tournament-id">---</strong></p>
      <button id="join-tournament" class="secondary">✅ Unirse</button>
      <button id="copy-link" class="secondary">🔗 Copiar enlace</button>
    </div>

    <div id="app" class="hidden">
      <div class="card">
        <h2>Jugadores</h2>
        <div id="players-list" class="players-grid"></div>
      </div>

      <div class="card">
        <div class="badge badge-round" id="round-indicator">Ronda 1 / 7</div>
        <h2>Ronda actual</h2>
        <div id="next-round"></div>
      </div>

      <div class="card">
        <h2>Registrar Resultados</h2>
        <div id="results-form"></div>
        <button id="btn-record" class="primary">✅ Registrar Ronda</button>
      </div>

      <div class="card">
        <h2>Ranking</h2>
        <table id="ranking-table">
          <thead><tr><th>Jugador</th><th>Puntos</th><th>Partidos</th></tr></thead>
          <tbody id="ranking-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  // 🔥 Configuración mínima (reemplaza con tu config real después)
  const firebaseConfig = {
    apiKey: "AIzaSyBx1234567890abcdefghijklm",
    authDomain: "americano-pro.firebaseapp.com",
    projectId: "americano-pro"
  };

  // Inicializar solo si no está inicializado
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  // Login con Google
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('login-btn');
    if (btn) {
      btn.addEventListener('click', () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider)
          .catch(err => {
            console.error("❌ Error:", err.code, err.message);
            alert("Error: " + err.message);
          });
      });
    }
  });
</script>
</body>

</html>
